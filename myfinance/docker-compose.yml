services:
  mysql:
    image: mysql:8.4
    container_name: myfinance-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: myfinance
      MYSQL_USER: myfinance
      MYSQL_PASSWORD: myfinance
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - myfinance_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "myfinance", "-pmyfinance"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  myfinance_mysql:
